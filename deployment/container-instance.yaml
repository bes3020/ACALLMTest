name: huggingface-llm
apiVersion: '2021-10-01'
location: eastus
tags:
  project: huggingface-llm
  environment: production

properties:
  containers:
    - name: text-generation-inference
      properties:
        image: ghcr.io/huggingface/text-generation-inference:latest
        ports:
          - protocol: TCP
            port: 80
        environmentVariables:
          - name: MODEL_ID
            value: 'TinyLlama/TinyLlama-1.1B-Chat-v1.0'
          - name: PORT
            value: '80'
          - name: HUGGING_FACE_HUB_TOKEN
            secureValue: 'YOUR_HF_TOKEN_HERE'
          - name: MAX_INPUT_LENGTH
            value: '1024'
          - name: MAX_TOTAL_TOKENS
            value: '2048'
          - name: MAX_CONCURRENT_REQUESTS
            value: '128'
        resources:
          requests:
            memoryInGB: 8
            cpu: 2
          limits:
            memoryInGB: 8
            cpu: 2
        volumeMounts:
          - name: model-cache
            mountPath: /data
            readOnly: false
  imageRegistryCredentials: []
  restartPolicy: Always
  ipAddress:
    ports:
      - protocol: TCP
        port: 80
    type: Public
    dnsNameLabel: huggingface-llm-demo
  osType: Linux
  volumes:
    - name: model-cache
      azureFile:
        shareName: modeldata
        readOnly: false
        storageAccountName: YOUR_STORAGE_ACCOUNT_NAME
        storageAccountKey: YOUR_STORAGE_ACCOUNT_KEY
  sku: Standard
